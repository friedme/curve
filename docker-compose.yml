services:
  web:
    build:
      context: .
      # The Pi's resolver is loopback-only (Pi-hole), so a build container
      # cannot resolve PyPI on its own network. This affects dependency
      # installation during the build, not the running container.
      network: host
    image: curve-app:latest
    ports:
      - "8001:8001"
    volumes:
      - curve-data:/app/data/snapshots
    restart: unless-stopped
    # uvicorn would otherwise be PID 1 and never reap Chromium's orphaned
    # children, which is how six zombie headless_shell processes accumulated.
    init: true
    # Chromium needs more than Docker's 64MB default /dev/shm
    shm_size: "512m"

  snapshot:
    # Same image as web, so `docker compose up --build` (deploy.sh) also updates
    # the nightly snapshot job. It used to build its own image, which never got rebuilt.
    image: curve-app:latest
    command: python snapshot.py
    shm_size: "512m"
    volumes:
      - curve-data:/app/data/snapshots
    # Run daily — use cron on the host or a scheduler container.
    # Simplest: add this to Pi's crontab:
    #   0 22 * * * docker compose -f /home/pi/curve/docker-compose.yml run --rm snapshot
    profiles:
      - tools

volumes:
  curve-data:
